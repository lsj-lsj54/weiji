services:
  mysql:
    image: mysql:latest
    container_name: weiji-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 6
      MYSQL_DATABASE: weiji
      MYSQL_USER: weiji
      MYSQL_PASSWORD: 6
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - weiji-mysql-data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7.2-alpine
    container_name: weiji-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "CHANGE_ME"]

volumes:
  weiji-mysql-data:
